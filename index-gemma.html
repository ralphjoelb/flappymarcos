<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manila Survival: Flappy Edition</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --accent-color: #00ff00;
            --danger-color: #ff0055;
            --border-width: 4px;
            --brutalist-shadow: 8px 8px 0px #000;
            --neo-brutalist-yellow: #fff200;
            --text-color: #000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 800px;
            border: var(--border-width) solid #000;
            box-shadow: var(--brutalist-shadow);
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        #score-display {
            font-size: 2rem;
            font-weight: 900;
            background: var(--neo-brutalist-yellow);
            padding: 5px 15px;
            border: var(--border-width) solid #000;
            box-shadow: 4px 4px 0px #000;
        }

        #game-over-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            background: #fff;
            border: var(--border-width) solid #000;
            box-shadow: 12px 12px 0px #000;
            padding: 25px;
            z-index: 100;
            text-align: center;
        }

        #game-over-modal h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            background: var(--danger-color);
            color: white;
            padding: 5px;
            border: 2px solid #000;
        }

        .chart-container {
            width: 100%;
            height: 150px;
            background: #eee;
            border: var(--border-width) solid #000;
            margin: 20px 0;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 5px;
        }

        .chart-bar {
            width: 20%;
            background: var(--danger-color);
            border: 2px solid #000;
            transition: height 0.5s ease-out;
        }

        .debt-label {
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .retry-btn {
            background: var(--accent-color);
            border: var(--border-width) solid #000;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
        }

        .retry-btn:active {
            box-shadow: 0px 0px 0px #000;
            transform: translate(4px, 4px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="score-display">0</div>
    </div>

    <div id="game-over-modal">
        <h2>SYSTEM FAILURE</h2>
        <div class="debt-label">NATIONAL DEBT INHERITED: <span id="debt-value">$0</span></div>
        <div class="chart-container" id="chart">
            <!-- Bars injected by JS -->
        </div>
        <button class="retry-btn" onclick="resetGame()">File for Extension (Retry)</button>
    </div>
</div>

<script>
/** @type {HTMLCanvasElement} */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score-display');
const modal = document.getElementById('game-over-modal');
const debtValueDisplay = document.getElementById('debt-value');
const chartContainer = document.getElementById('chart');

// Game Constants
const GRAVITY = 1200;
const JUMP_FORCE = -350;
const OBSTACLE_SPEED = 200;
const OBSTACLE_SPAWN_RATE = 1500; // ms
const PLAYER_SIZE = 40;

// Game State
let gameState = 'START'; // START, PLAYING, GAMEOVER
let lastTime = 0;
let score = 0;
let player;
let obstacles = [];
let particles = [];
let spawnTimer = 0;
let floodLevel = 0;
let floodAmplitude = 0;
let floodTime = 0;

// Assets
const playerImg = new Image();
playerImg.src = 'marcos.png';

class Player {
    constructor() {
        this.x = 50;
        this.y = canvas.height / 2;
        this.velocity = 0;
        this.radius = 18;
    }

    update(dt) {
        this.velocity += GRAVITY * dt;
        this.y += this.velocity * dt;

        // Clamp to canvas bounds
        if (this.y < 0) {
            this.y = 0;
            this.velocity = 0;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        // Rotate slightly based on velocity
        ctx.rotate(Math.min(Math.PI/4, Math.max(-Math.PI/4, this.velocity/1000)));
        
        // Draw image. We'll scale it to fit the radius roughly.
        ctx.drawImage(playerImg, -PLAYER_SIZE/2, -PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE);
        
        // Brutalist outline for the character to match theme
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeRect(-PLAYER_SIZE/2, -PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE);
        
        ctx.restore();
    }
}

class Obstacle {
    constructor(type) {
        this.type = type; // 'FLOOD', 'ELECTRIC', 'ECONOMY'
        this.width = 60;
        this.gap = 180;
        this.x = canvas.width + 100;
        this.passed = false;

        const minHeight = 50;
        const maxHeight = canvas.height - this.gap - minHeight - 100;
        this.topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
        this.bottomY = this.topHeight + this.gap;
    }

    update(dt) {
        this.x -= OBSTACLE_SPEED * dt;
    }

    draw() {
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#000';

        if (this.type === 'FLOOD') {
            // SUBSTANDARD FLOOD CONTROL (Concrete Blocks)
            ctx.fillStyle = '#555';
            // Top obstacle
            ctx.fillRect(this.x, 0, this.width, this.topHeight);
            ctx.strokeRect(this.x, 0, this.width, this.topHeight);
            // Bottom obstacle
            ctx.fillRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY);
            ctx.strokeRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY);
            
            ctx.fillStyle = '#f0f'; // neon pink highlight
            ctx.font = 'bold 10px Arial';
            ctx.fillText('FLOOD CONTROL', this.x + 2, this.topHeight - 5);
        } 
        else if (this.type === 'ELECTRIC') {
            // ELECTRICITY SURGE / BLACKOUT (Towers)
            ctx.fillStyle = '#222';
            // Top obstacle
            ctx.fillRect(this.x, 0, this.width, this.topHeight);
            ctx.strokeRect(this.x, 0, this.width, this.topHeight);
            // Bottom obstacle
            ctx.fillRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY);
            ctx.strokeRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY);
            
            // Draw sparks
            ctx.fillStyle = '#0ff';
            for(let i=0; i<5; i++) {
                ctx.fillRect(this.x + Math.random()*this.width, Math.random()*this.topHeight, 4, 4);
            }
            ctx.fillStyle = 'white';
            ctx.fillText('BLACKOUT', this.x + 2, this.topHeight - 5);
        }
        else if (this.type === 'ECONOMY') {
            // DEFLATED PHP VALUE (Red downward charts)
            ctx.fillStyle = '#ff0055';
            // Top obstacle
            ctx.fillRect(this.x, 0, this.width, this.topHeight);
            ctx.strokeRect(this.x, 0, this.width, this.topHeight);
            // Bottom obstacle
            ctx.fillRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY);
            ctx.strokeRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY);

            // Draw red "line chart" on the obstacle
            ctx.beginPath();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.moveTo(this.x, this.topHeight - 20);
            ctx.lineTo(this.x + (this.width/2), this.topHeight - 10);
            ctx.lineTo(this.x + this.width, this.topHeight - 30);
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.fillText('PHP DOWN', this.x + 2, this.topHeight - 5);
        }
    }

    getBounds() {
        return {
            top: { x: this.x, y: 0, w: this.width, h: this.topHeight },
            bottom: { x: this.x, y: this.bottomY, w: this.width, h: canvas.height - this.bottomY }
        };
    }
}

function drawManilaSilhouette() {
    // Dark neon silhouette of Manila
    ctx.fillStyle = '#0a0a0a';
    // Simple skyline representation
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    // Buildings
    ctx.lineTo(0, canvas.height - 150);
    ctx.lineTo(40, canvas.height - 150);
    ctx.lineTo(40, canvas.height - 250); // Tower 1
    ctx.lineTo(70, canvas.height - 250);
    ctx.lineTo(70, canvas.height - 180);
    ctx.lineTo(120, canvas.height - 180);
    ctx.lineTo(120, canvas.height - 300); // Tower 2
    ctx.lineTo(160, canvas.height - 300);
    ctx.lineTo(160, canvas.height - 150);
    ctx.lineTo(250, canvas.height - 150);
    ctx.lineTo(250, canvas.height - 350); // Tower 3
    ctx.lineTo(300, canvas.height - 350);
    ctx.lineTo(300, canvas.height - 120);
    ctx.lineTo(400, canvas.height - 120);
    ctx.lineTo(400, canvas.height - 200); // Tower 4
    ctx.lineTo(480, canvas.height - 200);
    ctx.lineTo(480, canvas.height);
    ctx.fill();

    // Neon glow effects
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00ffff';
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawFlood() {
    floodTime += 0.02;
    floodLevel = 40 + Math.sin(floodTime) * 10;
    floodAmplitude = 20 * Math.sin(floodTime * 0.5);

    // Fluid layer at bottom
    ctx.fillStyle = 'rgba(0, 0, 100, 0.7)';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let x = 0; x <= canvas.width; x += 10) {
        const y = canvas.height - floodLevel + Math.sin(x * 0.05 + floodTime) * 15;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();
    
    // Floating debris / foam
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    for(let i=0; i<5; i++) {
        const x = ((floodTime * 50 + i * 100) % canvas.width);
        const y = canvas.height - floodLevel + Math.sin(x * 0.05 + floodTime) * 15 - 5;
        ctx.fillRect(x, y, 10, 4);
    }
}

function checkCollision(p, obs) {
    const bounds = obs.getBounds();
    
    // Circular collision for player against rectangular obstacles
    const checkRectCircle = (rect, circle) => {
        let closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        let closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
        let distanceX = circle.x - closestX;
        let distanceY = circle.y - closestY;
        return (distanceX * distanceX + distanceY * distanceY) < (circle.radius * circle.radius);
    };

    return checkRectCircle(bounds.top, p) || checkRectCircle(bounds.bottom, p);
}

function gameOver() {
    gameState = 'GAMEOVER';
    modal.style.display = 'block';
    
    const debt = score * 125000000; // $125M per point
    debtValueDisplay.innerText = `$${(debt / 1e9).toFixed(2)}B`;
    
    // Build chart
    chartContainer.innerHTML = '';
    const baseDebt = 5e12; // $5T base
    for(let i=0; i<5; i++) {
        const bar = document.createElement('div');
        bar.className = 'chart-bar';
        const heightPercent = Math.min(100, ((baseDebt + (debt / (i+1))) / (baseDebt * 2)) * 100);
        bar.style.height = `${heightPercent}%`;
        chartContainer.appendChild(bar);
    }
}

function resetGame() {
    score = 0;
    scoreDisplay.innerText = '0';
    player = new Player();
    obstacles = [];
    particles = [];
    spawnTimer = 0;
    gameState = 'PLAYING';
    modal.style.display = 'none';
    lastTime = performance.now();
}

function init() {
    // Resize canvas to container size
    const container = document.getElementById('game-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;

    player = new Player();
    gameState = 'START';
    
    requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0, canvas.width, canvas.height);
    drawManilaSilhouette();
    drawFlood();

    if (gameState === 'PLAYING') {
        // Update player
        player.update(dt);
        player.draw();

        // Handle Obstacles
        spawnTimer += dt * 1000;
        if (spawnTimer > OBSTACLE_SPAWN_RATE) {
            const types = ['FLOOD', 'ELECTRIC', 'ECONOMY'];
            const type = types[Math.floor(Math.random() * types.length)];
            obstacles.push(new Obstacle(type));
            spawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.update(dt);
            obs.draw();

            // Collision
            if (checkCollision(player, obs)) {
                gameOver();
            }

            // Point scoring
            if (!obs.passed && obs.x + obs.width < player.x) {
                obs.passed = true;
                score++;
                scoreDisplay.innerText = score;
            }

            // Remove off-screen
            if (obs.x + obs.width < 0) {
                obstacles.splice(i, 1);
            }
        }

        // Boundary Check (Ground/Ceiling)
        if (player.y + player.radius > canvas.height - floodLevel + 10 || player.y - player.radius < 0) {
            gameOver();
        }

    } else if (gameState === 'START') {
        ctx.fillStyle = 'white';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('TAP TO SURVIVE MANILA', canvas.width/2, canvas.height/2);
        ctx.font = '16px Courier New';
        ctx.fillText('Avoid systemic issues & rising floods', canvas.width/2, canvas.height/2 + 40);
    }

    requestAnimationFrame(gameLoop);
}

// Inputs
const handleAction = () => {
    if (gameState === 'START') {
        gameState = 'PLAYING';
    } else if (gameState === 'PLAYING') {
        player.velocity = JUMP_FORCE;
    }
};

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') handleAction();
});
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleAction();
}, { passive: false });
canvas.addEventListener('mousedown', handleAction);

window.addEventListener('load', init);

</script>
</body>
</html>
